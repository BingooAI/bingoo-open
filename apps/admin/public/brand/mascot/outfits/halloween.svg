<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 20 834 1010"><style>
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-14px) rotate(1deg)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.4)}}
@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(130px) rotate(220deg);opacity:.9}}
@keyframes smilepulse{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.06)}}
.all,.hat,.pom,.scarf,.ball,.item,.flame,.mouth,.prop{transform-box:fill-box}
.all{transform-origin:center bottom;animation:bob 3s ease-in-out infinite}
.mouth{transform-origin:center;animation:smilepulse 2.6s ease-in-out infinite}
