name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The floor declared in package.json engines. CI tests the floor deliberately:
  # running only the newest version is how an unsupported-syntax bug reaches a user.
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA — a moving tag is a supply-chain hole.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Build first: `typecheck` resolves the package through its published `types` entry,
      # which points into dist/. Checking a clean checkout before building reports the result
      # as `any` rather than as the missing build it actually is.
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The ethical invariants (A7) are a tested promise, not an aspiration. They get their own
  # job — separate from `quality` — so a failure names itself in the checks list rather than
  # hiding inside a generic red X, and so it can be a required status check that nobody waves
  # through on the grounds that the suite is flaky today.
  invariants:
    name: Ethical invariants (A7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Dispositions unscored · no ranking · privacy strict · human review
        run: pnpm --filter @bingoo.ai/contracts exec vitest run test/invariants.test.ts

  # R2: contracts is the root of the dependency graph and has no outgoing edges. The lint rule
  # catches an import of a sibling package; this catches the subtler version — a runtime
  # dependency added to package.json that nobody imports yet but somebody eventually will.
  purity:
    name: No dependencies beyond zod (R2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Assert the dependency list
        run: |
          deps=$(node -p "Object.keys(require('./packages/contracts/package.json').dependencies ?? {}).sort().join(',')")
          if [ "$deps" != "zod" ]; then
            echo "contracts must depend on zod and nothing else (R2). Found: $deps"
            exit 1
          fi

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Secret scanning is GitHub's native feature, enabled in repository settings, not a step
      # here. It is free on public repositories and — unlike scanning after the fact — push
      # protection rejects a secret before it reaches the repository, which is the only point
      # at which the problem is still cheap.

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # An incompatible licence must fail the build, not surface at release time.
      - name: Licence compatibility
        run: pnpm dlx license-checker-rseidelsohn --production --onlyAllow "Apache-2.0;MIT;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Unlicense;Python-2.0;BlueOak-1.0.0" --excludePrivatePackages

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Code scanning is free on public repositories and licensed on private ones. This repository
    # is private today, so the upload is refused no matter how the job is configured, and the
    # check had been red on every run for weeks. A permanently red check is worse than an absent
    # one: reviewers learn to wave it through, and the day it goes red for a real finding it
    # looks exactly like every other day. The changeset job below declines to run for the same
    # reason, in the same words.
    #
    # The condition reads the visibility rather than a flag someone has to remember to flip, so
    # scanning resumes by itself the moment this repository is public again — which is what
    # docs/adr and the licence both say it is meant to be. Nothing here disables scanning where
    # scanning can actually run.
    if: github.event.repository.visibility == 'public'
    # An explicit permissions block sets everything it does not name to `none`, including the
    # repository default. On a public repository that was survivable, because the analyser only
    # reads run metadata as a nicety. On a private one the same call is mandatory, so the job
    # started failing the moment this repository stopped being public — with an error naming an
    # API endpoint rather than the permission behind it. Kept because visibility can change back.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    # Dependabot cannot write a changeset, so requiring one of it only produces a red check
    # that reviewers learn to wave through — which is worse than not checking at all. A
    # dependency bump that needs a release gets its changeset from the human who merges it.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A published package changing without a changeset is a release nobody announced.
      - name: Require a changeset for published-package changes
        run: pnpm changeset status --since=origin/main
